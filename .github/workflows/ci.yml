# The same gate the release runs, on every push and pull request: unit tests,
# typecheck (sources and tests) and the production build. A release should
# never be the first run to find a failure.
#
# Supply chain: actions are pinned to a commit (a tag can be moved), the
# checkout keeps no token on disk, and dependencies install without running
# their install scripts. Advisories are audit.yml's: an advisory published
# for a build tool should not turn an unrelated change red.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: manifest.json, package.json and package-lock.json carry the same version
        run: |
          m="$(node -p "require('./manifest.json').version")"
          p="$(node -p "require('./package.json').version")"
          l="$(node -p "require('./package-lock.json').version")"
          if [ "$m" != "$p" ] || [ "$p" != "$l" ]; then
            echo "::error::manifest.json says $m, package.json $p, package-lock.json $l."
            exit 1
          fi
