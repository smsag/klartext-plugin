# Known vulnerabilities in the tools that build the plugin. The bundle itself
# has no runtime dependencies; what is audited is what runs on a developer's
# machine and in CI.
#
# Not part of the per-change gate (ci.yml): an advisory is published whenever
# it is published, and a docs fix should not turn red for it. This runs every
# week, on demand, and on any change to the dependencies, where it belongs to
# the change.
name: Audit

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  push:
    paths: [package.json, package-lock.json]
  pull_request:
    paths: [package.json, package-lock.json]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: No known vulnerability of high severity
        run: npm audit --audit-level=high
